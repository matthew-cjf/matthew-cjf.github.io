document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"f9a9ec87-1aa1-4aab-9a8e-9bd7bd2f8a54\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\nbody{margin:0;background:#fcfbf4;color:#1b1f24;font-family:\"Helvetica Neue LT Pro\",\"Helvetica Neue\",Helvetica,Arial,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\na{color:#2e3192;text-decoration:none}\na:hover{color:#1b1f24;text-decoration:underline}\ninput,textarea,button{font-family:inherit;font-weight:400}\n<\u002Fstyle>\n<title>citizen journal foundation<\u002Ftitle>\n<script src=\"6b94b745-a3f1-4035-a910-8b40720e29ff\" async=\"\"><\u002Fscript>\n\n<\u002Fhelmet>\n<div style=\"min-height:100vh;display:flex;flex-direction:column;text-transform:lowercase\">\n\n\n  <header style=\"border-bottom:1px solid #1b1f24;background:#fcfbf4;position:sticky;top:0;z-index:5\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer;font-weight:500;font-size:24px;letter-spacing:-0.02em;display:flex;gap:6px;align-items:baseline\">\n        <span style=\"color:#2e3192\">citizen journal<\u002Fspan><span style=\"color:#d9a420\">foundation<\u002Fspan>\n      <\u002Fdiv>\n      <nav style=\"display:flex;gap:28px;font-size:16px;flex-wrap:wrap;align-items:center\">\n        <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"4\">\n          <span sc-camel-on-click=\"{{ n.go }}\" style=\"cursor:pointer;color:{{ n.color }};border-bottom:1px solid {{ n.line }};padding-bottom:2px\">{{ n.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"flex:1\">\n\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"max-width:1200px;margin:0 auto;padding:96px 24px 72px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:56px;align-items:end\">\n        <div>\n          <div style=\"font-size:14px;color:#6b7178;margin-bottom:24px\">a kansas 501(c)(3) non-profit<\u002Fdiv>\n          <h1 style=\"font-weight:500;font-size:clamp(44px,6vw,80px);line-height:1;letter-spacing:-0.035em;margin:0;text-wrap:balance\">local news for places that lost it.<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:28px;padding-bottom:8px\">\n          <p style=\"font-size:20px;line-height:1.5;margin:0;max-width:480px;text-wrap:pretty\">the foundation holds citizen journal's journalism and the grants that fund it. we report on communities in news deserts across kansas.<\u002Fp>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n            <span sc-camel-on-click=\"{{ goContact }}\" style=\"cursor:pointer;flex:none;white-space:nowrap;background:#2e3192;color:#fcfbf4;padding:14px 22px;border-radius:2px;font-size:16px\" style-hover=\"background:#1b1f24\">talk to us about funding<\u002Fspan>\n            <span sc-camel-on-click=\"{{ goAbout }}\" style=\"cursor:pointer;flex:none;white-space:nowrap;border:1px solid #1b1f24;padding:13px 22px;border-radius:2px;font-size:16px\" style-hover=\"background:#1b1f24;color:#fcfbf4\">about the foundation<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:1200px;margin:0 auto;padding:0 24px\">\n        <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"aspect-ratio:3/2;max-height:620px;width:100%;border-radius:2px;overflow:hidden;background:#efece0\">\n            <img src=\"{{ hero.src }}\" alt=\"{{ hero.caption }}\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n          <\u002Fdiv>\n          <figcaption style=\"text-transform:none;font-size:14px;line-height:1.5;color:#6b7178;max-width:720px;text-wrap:pretty\">{{ hero.caption }}<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fsection>\n\n      <section style=\"max-width:1200px;margin:0 auto;padding:112px 24px\">\n        <div style=\"font-size:14px;color:#6b7178;margin-bottom:40px\">what the foundation does<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:0;border-top:1px solid #1b1f24\">\n          <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"padding:28px 28px 28px 0;display:flex;flex-direction:column;gap:14px\">\n              <div style=\"width:12px;height:12px;background:{{ p.color }}\"><\u002Fdiv>\n              <h3 style=\"font-weight:500;font-size:24px;letter-spacing:-0.02em;margin:0\">{{ p.title }}<\u002Fh3>\n              <p style=\"font-size:17px;line-height:1.5;margin:0;color:#1b1f24;max-width:320px\">{{ p.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:1200px;margin:0 auto;padding:0 24px 112px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap;margin-bottom:40px\">\n          <div style=\"font-size:14px;color:#6b7178\">current grants<\u002Fdiv>\n          <div style=\"font-size:14px;color:#6b7178\">more to come<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #1b1f24\">\n          <sc-for list=\"{{ grants }}\" as=\"g\" hint-placeholder-count=\"1\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:40px;padding:36px 0;border-bottom:1px solid #1b1f24\">\n              <div style=\"display:flex;flex-direction:column;gap:14px\">\n                <h3 style=\"font-weight:500;font-size:clamp(28px,3vw,40px);letter-spacing:-0.03em;line-height:1.05;margin:0\">{{ g.name }}<\u002Fh3>\n                <p style=\"font-size:18px;line-height:1.5;margin:0;max-width:480px;text-wrap:pretty\">{{ g.body }}<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column\">\n                <sc-for list=\"{{ g.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid;grid-template-columns:120px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid #d9d6c8;font-size:16px\">\n                    <span style=\"color:#6b7178\">{{ r.k }}<\u002Fspan><span>{{ r.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"background:#1b1f24;color:#fcfbf4\">\n        <div style=\"max-width:1200px;margin:0 auto;padding:96px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:center\">\n          <h2 style=\"font-weight:500;font-size:clamp(32px,4vw,52px);line-height:1.05;letter-spacing:-0.03em;margin:0;text-wrap:balance\">fund reporting in a kansas news desert.<\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:24px\">\n            <p style=\"font-size:18px;line-height:1.55;margin:0;color:#fcfbf4;max-width:460px\">your donations go directly to the work our journalists do in the communities across kansas that we serve.<\u002Fp>\n            <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n              <span sc-camel-on-click=\"{{ goContact }}\" style=\"cursor:pointer;flex:none;white-space:nowrap;background:#fdd04f;color:#1b1f24;padding:14px 22px;border-radius:2px;font-size:16px\" style-hover=\"background:#fcfbf4\">contact us<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"max-width:1200px;margin:0 auto;padding:96px 24px 64px\">\n        <div style=\"font-size:14px;color:#6b7178;margin-bottom:24px\">about<\u002Fdiv>\n        <h1 style=\"font-weight:500;font-size:clamp(40px,5vw,68px);line-height:1.02;letter-spacing:-0.035em;margin:0;max-width:900px;text-wrap:balance\">we want to fill the gap in local reporting.<\u002Fh1>\n      <\u002Fsection>\n      <section style=\"max-width:1200px;margin:0 auto;padding:0 24px 96px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:56px\">\n        <div style=\"display:flex;flex-direction:column;gap:20px;font-size:19px;line-height:1.55;max-width:560px\">\n          <p style=\"margin:0\">with the loss of local journalists across the country and news deserts abundant, communities are desperate for news coverage.<\u002Fp>\n          <p style=\"margin:0\">citizen journal foundation is the non-profit arm of citizen journal. it holds much of the journalism, along with grants that improve quality of life and strengthen the economy in rural kansas.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;border-top:1px solid #1b1f24\">\n          <sc-for list=\"{{ facts }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:140px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid #d9d6c8;font-size:16px\">\n              <span style=\"color:#6b7178\">{{ f.k }}<\u002Fspan><span>{{ f.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"max-width:1200px;margin:0 auto;padding:0 24px 112px\">\n        <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"aspect-ratio:16/9;max-height:520px;width:100%;border-radius:2px;overflow:hidden;background:#efece0\">\n            <img src=\"fdbe850d-d22a-41be-a527-0259fa0261f1\" alt=\"Downtown McPherson is shown on July 9, 2026.\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n          <\u002Fdiv>\n          <figcaption style=\"text-transform:none;font-size:14px;line-height:1.5;color:#6b7178;max-width:720px\">Downtown McPherson is shown on July 9, 2026. (Matthew Petillo/Citizen Journal)<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDonate }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"max-width:1200px;margin:0 auto;padding:96px 24px 112px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:64px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:24px\">\n          <div style=\"font-size:14px;color:#6b7178\">donate<\u002Fdiv>\n          <h1 style=\"font-weight:500;font-size:clamp(40px,5vw,64px);line-height:1.02;letter-spacing:-0.035em;margin:0;text-wrap:balance\">support local reporting.<\u002Fh1>\n          <p style=\"font-size:19px;line-height:1.55;margin:0;max-width:460px\">gifts go to citizen journal foundation, a 501(c)(3) non-profit registered with the irs. ein 41-3310184.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #1b1f24;border-radius:2px;padding:32px;display:flex;flex-direction:column;gap:28px\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;border:1px solid #1b1f24;border-radius:2px;overflow:hidden\">\n            <sc-for list=\"{{ freqs }}\" as=\"q\" hint-placeholder-count=\"2\">\n              <span sc-camel-on-click=\"{{ q.pick }}\" style=\"cursor:pointer;text-align:center;padding:12px;font-size:16px;background:{{ q.bg }};color:{{ q.fg }}\">{{ q.label }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px\">\n            <sc-for list=\"{{ amounts }}\" as=\"a\" hint-placeholder-count=\"4\">\n              <span sc-camel-on-click=\"{{ a.pick }}\" style=\"cursor:pointer;text-align:center;padding:16px 0;font-size:20px;border:1px solid {{ a.border }};background:{{ a.bg }};color:{{ a.fg }};border-radius:2px\">{{ a.label }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;color:#6b7178\">other amount\n            <input value=\"{{ custom }}\" sc-camel-on-change=\"{{ onCustom }}\" placeholder=\"$\" style=\"font-size:18px;padding:14px;border:1px solid #6b7178;border-radius:2px;background:#fcfbf4;color:#1b1f24;outline:none\">\n          <\u002Flabel>\n          <span sc-camel-on-click=\"{{ submitDonate }}\" style=\"cursor:pointer;text-align:center;background:#2e3192;color:#fcfbf4;padding:16px;border-radius:2px;font-size:17px\" style-hover=\"background:#1b1f24\">{{ donateLabel }}<\u002Fspan>\n          <sc-if value=\"{{ donated }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:15px;color:#127a02\">thank you. payment processing is not connected in this prototype.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"max-width:1200px;margin:0 auto;padding:96px 24px 112px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:64px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:24px\">\n          <div style=\"font-size:14px;color:#6b7178\">contact<\u002Fdiv>\n          <h1 style=\"font-weight:500;font-size:clamp(40px,5vw,64px);line-height:1.02;letter-spacing:-0.035em;margin:0;text-wrap:balance\">get in touch.<\u002Fh1>\n          <p style=\"font-size:19px;line-height:1.55;margin:0;max-width:460px\">for grants, partnerships, or questions about the foundation.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:6px;font-size:17px;padding-top:8px\">\n            <a href=\"mailto:hello@citizenjournal.foundation\">hello@citizenjournal.foundation<\u002Fa>\n            <a href=\"tel:+16205049886\">(620) 504-9886<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-transform:none;min-height:350px\">\n          <iframe src=\"https://tally.so/embed/XxZ1z4?alignLeft=1&amp;hideTitle=1&amp;transparentBackground=1&amp;dynamicHeight=1\" data-tally-src=\"https://tally.so/embed/XxZ1z4?alignLeft=1&amp;hideTitle=1&amp;transparentBackground=1&amp;dynamicHeight=1\" width=\"100%\" height=\"500\" frameborder=\"0\" marginheight=\"0\" marginwidth=\"0\" title=\"Contact us\" style=\"border:0;display:block\"><\u002Fiframe>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <footer style=\"border-top:1px solid #1b1f24\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:40px 24px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-end\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-weight:500;font-size:20px;letter-spacing:-0.02em;display:flex;gap:5px\"><span style=\"color:#2e3192\">citizen journal<\u002Fspan><span style=\"color:#d9a420\">foundation<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:24px;font-size:14px;flex-wrap:wrap\">\n        <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"4\">\n          <span sc-camel-on-click=\"{{ n.go }}\" style=\"cursor:pointer;color:#1b1f24\">{{ n.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startPage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;donate&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: this.props.startPage ?? 'home', freq: 'monthly', amt: 25, custom: '', donated: false, sent: false };\n  static HEROES = [\n    { src: 'photos/20260916_1127_ACR18.webp', caption: 'The Budweiser Clydesdales trot down a road at the Kansas State Fair in Hutchinson, Kan. on Sept. 16, 2026. (Dale Grosbach for Citizen Journal)' },\n    { src: 'photos/IMG_0151.webp', caption: 'Vice President JD Vance speaks during a rally in Olathe, Kan. on Sept. 14, 2026. (Matthew Petillo/Citizen Journal)' },\n    { src: 'photos/20260912_0219_ACR18.webp', caption: 'Supporters of Cindy Holscher hold signs during a Kansas gubernatorial debate at the Kansas State Fair on Sept. 12, 2026. (Dale Grosbach for Citizen Journal)' },\n    { src: 'photos/IMG_9743.webp', caption: 'A customer collects their food at The Cozy Inn in Salina, Kan. on Aug. 29, 2026. (Matthew Petillo/Citizen Journal)' },\n    { src: 'photos/IMG_9730.webp', caption: \"Students talk on McPherson College's campus in McPherson, Kan. on Aug. 29, 2026. (Matthew Petillo/Citizen Journal)\" },\n    { src: 'photos/excited.webp', caption: 'Gavin Barnett (left) talks to students about the esports club on the McPherson College campus as part of the back-to-school bash festivities at the new campus commons on Monday, Aug. 19, 2026. (Sarah Newberry/Citizen Journal)' },\n    { src: 'photos/image1.webp', caption: 'Haley Samford (left) and Elizabeth Allison run a lap on the hill at Coronado Heights on Aug. 3, 2026. Both were running as part of Sweaty Swedes, a workout group that operates during the summers. (Sarah Newberry/Citizen Journal)' }\n  ];\n  hero = Component.HEROES[Math.floor(Math.random() * Component.HEROES.length)];\n  loadTally() {\n    if (this.state.page !== 'contact') return;\n    setTimeout(() => {\n      if (typeof Tally !== 'undefined') Tally.loadEmbeds();\n      else document.querySelectorAll('iframe[data-tally-src]:not([src])').forEach(e => { e.src = e.dataset.tallySrc; });\n    }, 0);\n  }\n  componentDidMount() { this.loadTally(); }\n  componentDidUpdate(_, prev) { if (prev.page !== this.state.page) this.loadTally(); }\n  go = p => () => { this.setState({ page: p, donated: false, sent: false }); window.scrollTo(0, 0); };\n  renderVals() {\n    const s = this.state;\n    const nav = [['home','home'],['about','about'],['contact','contact']].map(([id,label]) => ({\n      label, go: this.go(id), color: s.page === id ? '#2e3192' : '#1b1f24', line: s.page === id ? '#2e3192' : 'transparent'\n    }));\n    const freqs = ['one-time','monthly'].map(f => ({ label: f, pick: () => this.setState({ freq: f }), bg: s.freq === f ? '#1b1f24' : '#ffffff', fg: s.freq === f ? '#fcfbf4' : '#1b1f24' }));\n    const amounts = [10,25,50,100].map(v => { const on = !s.custom && s.amt === v; return { label: '$' + v, pick: () => this.setState({ amt: v, custom: '' }), bg: on ? '#2e3192' : '#ffffff', fg: on ? '#fcfbf4' : '#1b1f24', border: on ? '#2e3192' : '#6b7178' }; });\n    const total = s.custom ? s.custom.replace(/[^0-9.]/g, '') : s.amt;\n    return {\n      nav, freqs, amounts, hero: this.hero,\n      isHome: s.page === 'home', isAbout: s.page === 'about', isDonate: s.page === 'donate', isContact: s.page === 'contact',\n      goHome: this.go('home'), goAbout: this.go('about'), goDonate: this.go('donate'), goContact: this.go('contact'),\n      pillars: [\n        { title: 'journalism', body: 'the foundation supports much of citizen journal\\'s reporting across kansas.', color: '#2e3192' },\n        { title: 'grants', body: 'focused work that benefits all of kansas.', color: '#d9a420' },\n        { title: 'communities', body: 'we focus on kansas communities that have lost local journalists.', color: '#127a02' }\n      ],\n      grants: [\n        { name: 'project hamilton', body: 'technical assistance that brings offline rural kansas businesses online: online sales, digital marketing, and scheduling.', rows: [\n          { k: 'funder', v: 'usda rural development · rural business development grant' },\n          { k: 'amount', v: '$95,000' },\n          { k: 'area', v: 'mcpherson county' },\n          { k: 'partners', v: 'mcpherson college · mcpherson industrial development company' }\n        ] }\n      ],\n      facts: [\n        { k: 'organization', v: 'citizen journal foundation' },\n        { k: 'type', v: '501(c)(3) non-profit, registered with the irs' },\n        { k: 'based in', v: 'mcpherson, kansas' }\n      ],\n      fields: [{ label: 'name' }, { label: 'email' }, { label: 'organization' }],\n      custom: s.custom,\n      onCustom: e => this.setState({ custom: e.target.value }),\n      donateLabel: 'donate $' + (total || 0) + (s.freq === 'monthly' ? ' monthly' : ''),\n      submitDonate: () => this.setState({ donated: true }),\n      donated: s.donated, sent: s.sent,\n      submitContact: () => this.setState({ sent: true })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
